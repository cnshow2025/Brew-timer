<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE9DC">
<title>手沖咖啡計時器</title>
<meta name="description" content="四種沖法的分段注水計時，顯示累計克數與剩餘秒數，可對照電子秤使用。">
<meta property="og:type" content="website">
<meta property="og:title" content="手沖咖啡計時器">
<meta property="og:description" content="四種沖法的分段注水計時，顯示累計克數與剩餘秒數，可對照電子秤使用。">
<meta property="og:url" content="https://cnshow2025.github.io/Brew-timer/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="手沖咖啡計時器">
<meta name="twitter:description" content="四種沖法的分段注水計時，顯示累計克數與剩餘秒數，可對照電子秤使用。">
<style>
  :root{
    --paper:#EFE9DC;
    --paper-2:#E6DFCF;
    --paper-top:#F4EFE4;
    --ink:#2B2723;
    --ink-soft:#7C7466;
    --hair:#CFC6B2;
    --brew-deep:#6B4226;
    --brew-pour:#5C3A22;
    --brew-wait:#9C6B45;
    --steel:#9A9384;
    --moss:#4F6152;
    --glass:#B9B2A1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}

  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper-top);
    color:var(--ink);
    font-family:"Songti TC","Noto Serif CJK TC","Noto Serif TC","Source Han Serif TC",
                "Iowan Old Style",Georgia,serif;
    display:flex;
    justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  body::after{  /* 紙纖維 */
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  .wrap{
    width:100%;max-width:520px;min-height:100vh;
    padding:26px 20px 34px;
    display:flex;flex-direction:column;gap:20px;
    position:relative;z-index:1;
  }

  header{text-align:center}
  .eyebrow{
    margin:0 0 6px;font-size:11px;letter-spacing:.42em;text-indent:.42em;
    color:var(--ink-soft);font-family:"Iowan Old Style",Georgia,serif;
  }
  h1{margin:0;font-size:26px;font-weight:500;letter-spacing:.28em;text-indent:.28em}
  .rule{height:1px;background:var(--hair);margin:14px auto 12px;width:64px}
  .summary{
    display:block;margin:0 auto;padding:4px 6px;
    background:none;border:none;cursor:pointer;font-family:inherit;
    font-size:12px;letter-spacing:.14em;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .summary:active{color:var(--ink)}

  /* ── 左：動畫　右：段落清單 ── */
  .stage{display:grid;grid-template-columns:30% 70%;gap:12px;align-items:stretch}
  .scene{display:flex;align-items:flex-start;justify-content:center}
  .scene svg{width:100%;height:auto;max-width:170px;display:block}
  .kettle{
    transform-box:view-box;transform-origin:93px 40px;
    transition:transform .55s cubic-bezier(.4,.1,.2,1);
  }
  .kettle.pouring{transform:rotate(-20deg)}
  .rig{transform-box:view-box;transform-origin:60px 60px}
  .rig.circling{animation:swirl 2.8s ease-in-out infinite}
  @keyframes swirl{
    0%,100%{transform:translate(-6px,0)}
    25%    {transform:translate(0,-2.5px)}
    50%    {transform:translate(6px,0)}
    75%    {transform:translate(0,2.5px)}
  }

  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .step{
    border-left:2px solid var(--hair);padding:7px 0 7px 9px;
    transition:border-color .4s,opacity .4s;
  }
  .done-note .step-name{color:var(--moss)}
  .step.is-active{border-left-color:var(--moss)}
  .step-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
  .step-name{font-size:14px;letter-spacing:.1em;color:var(--ink)}
  .step.is-active .step-name{color:var(--moss)}
  .step-time{
    font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;
    font-family:"Iowan Old Style",Georgia,serif;
  }
  .step-state{
    display:inline-block;margin-left:6px;font-size:10px;letter-spacing:.1em;
    color:var(--ink-soft);
  }
  .step.is-active .step-state{color:var(--moss)}
  .step-hint{
    margin:3px 0 0;font-size:11px;line-height:1.6;color:var(--ink-soft);
    letter-spacing:.02em;
  }
  .step-water{color:var(--brew-deep);font-variant-numeric:tabular-nums}
  .step.is-active .step-hint{line-height:1.45}
  .step.is-active .step-water{
    font-size:21px;font-weight:600;letter-spacing:0;
    font-family:"Iowan Old Style",Georgia,serif;
  }
  .subs{display:flex;flex-direction:column;gap:1px;margin-top:4px}
  .sub{
    display:flex;align-items:baseline;gap:6px;
    font-variant-numeric:tabular-nums;color:var(--ink-soft);
    transition:color .3s;
  }
  .sub-label{font-size:11px;letter-spacing:.14em;white-space:nowrap}
  .sub-time{font-size:13px;font-family:"Iowan Old Style",Georgia,serif;line-height:1.3}
  .sub.on{color:var(--moss)}
  .sub.on .sub-time{font-size:26px;letter-spacing:.02em;line-height:1.15}
  .sub.off{opacity:.35}

  /* ── 左欄底部的累計計時 ── */
  .scene-col{display:flex;flex-direction:column;align-items:center;gap:2px}
  .elapsed{
    margin:8px 0 0;font-size:15px;letter-spacing:.02em;color:var(--ink);
    font-variant-numeric:tabular-nums;white-space:nowrap;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  .elapsed-g{margin-left:7px;color:var(--brew-deep)}

  /* ── 下半部：按鈕與設定 ── */
  .lower{
    flex:1;
    margin:10px -20px -34px;
    padding:22px 20px 34px;
    background:var(--paper-2);
    box-shadow:0 0 0 100vmax var(--paper-2);
    clip-path:inset(0 -100vmax);
    display:flex;flex-direction:column;gap:20px;
  }

  /* ── 控制 ── */
  .controls{display:flex;justify-content:center;align-items:center;gap:12px}
  button{
    font-family:inherit;cursor:pointer;border-radius:2px;
    transition:background .2s,color .2s,border-color .2s,opacity .2s;
  }
  button:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
  .primary{
    background:var(--ink);color:var(--paper);border:1px solid var(--ink);
    padding:13px 40px;font-size:15px;letter-spacing:.3em;text-indent:.3em;
  }
  .primary:active{background:#413a32}
  .ghost{
    background:transparent;color:var(--ink-soft);border:1px solid var(--hair);
    padding:13px 18px;font-size:14px;letter-spacing:.2em;text-indent:.2em;
  }
  .ghost:active{background:rgba(0,0,0,.04)}
  .ghost:disabled{opacity:.35;cursor:default}
  .icon{padding:13px 14px;text-indent:0;letter-spacing:0;font-size:16px}

  /* ── 設定 ── */
  .settings{
    border-top:1px solid var(--hair);padding-top:18px;
    display:flex;flex-direction:column;gap:18px;
  }
  .set-title{margin:0;font-size:12px;letter-spacing:.3em;color:var(--ink-soft)}
  .block{display:flex;flex-direction:column;gap:8px}
  .block-head{display:flex;justify-content:space-between;align-items:baseline}
  .block-label{font-size:12px;letter-spacing:.24em;color:var(--ink-soft)}
  .block-value{
    font-size:12px;letter-spacing:.1em;color:var(--brew-deep);
    font-variant-numeric:tabular-nums;font-family:"Iowan Old Style",Georgia,serif;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    border:1px solid var(--hair);background:transparent;color:var(--ink-soft);
    padding:7px 12px;font-size:13px;letter-spacing:.06em;
    font-variant-numeric:tabular-nums;
  }
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .recipe-note{margin:2px 0 0;font-size:11px;line-height:1.7;color:var(--ink-soft);letter-spacing:.04em}

  .srow{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--hair)}
  .srow:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .srow-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .srow-head input[type=text]{
    font-family:inherit;font-size:15px;color:var(--ink);
    background:transparent;border:none;border-bottom:1px solid var(--hair);
    padding:6px 2px;flex:1;min-width:0;letter-spacing:.12em;
  }
  .srow-sum{
    font-size:12px;color:var(--ink-soft);letter-spacing:.1em;
    font-variant-numeric:tabular-nums;font-family:"Iowan Old Style",Georgia,serif;
  }
  .field{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
  .field-label{font-size:13px;letter-spacing:.18em;color:var(--ink-soft);white-space:nowrap}
  .field-label i{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:8px;vertical-align:1px;
  }
  .dot-pour{background:var(--brew-pour)}
  .dot-wait{background:var(--brew-wait)}
  .stepper{display:flex;align-items:center;gap:2px}
  .stepper button{
    background:transparent;border:1px solid var(--hair);color:var(--ink-soft);
    width:34px;height:34px;font-size:16px;line-height:1;
  }
  .stepper input{
    font-family:"Iowan Old Style",Georgia,serif;font-variant-numeric:tabular-nums;
    width:54px;text-align:center;font-size:15px;color:var(--ink);
    background:transparent;border:none;border-bottom:1px solid var(--hair);
    padding:6px 0;-moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .unit{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;width:22px}
  .locked{opacity:.45}
  .note{margin:0;font-size:11px;line-height:1.7;color:var(--ink-soft);letter-spacing:.06em}

  @media (max-width:340px){
    .big{font-size:50px}
    .primary{padding:12px 28px}
  }
  @media (prefers-reduced-motion:reduce){
    #pourStream,#dripStream,.rig{animation:none!important}
    *{transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<main class="wrap">

  <header>
    <p class="eyebrow">POUR OVER</p>
    <h1>注水計時</h1>
    <div class="rule"></div>
    <button class="summary" id="summaryLine" aria-label="開啟沖煮設定"></button>
  </header>

  <section class="stage">
    <div class="scene-col">
      <div class="scene" id="scene"></div>
      <p class="elapsed" id="elapsedLine">00:00<span class="elapsed-g">0 g</span></p>
    </div>
    <ol class="steps" id="stepList"></ol>
  </section>

  <div class="lower">

  <div class="controls">
    <button class="primary" id="startBtn">開始</button>
    <button class="ghost" id="resetBtn">重設</button>
    <button class="ghost icon" id="gearBtn" aria-label="設定" aria-expanded="false">⚙</button>
  </div>

  <section class="settings" id="settings" hidden>

    <div class="block">
      <div class="block-head">
        <span class="block-label">粉重</span>
        <span class="block-value" id="doseValue"></span>
      </div>
      <div class="chips" id="doseChips"></div>
    </div>

    <div class="block">
      <div class="block-head">
        <span class="block-label">粉水比</span>
        <span class="block-value" id="waterValue"></span>
      </div>
      <div class="chips" id="ratioChips"></div>
    </div>

    <div class="block">
      <div class="block-head">
        <span class="block-label">沖法</span>
        <span class="block-value" id="recipeTime"></span>
      </div>
      <div class="chips" id="recipeChips"></div>
      <p class="recipe-note" id="recipeNote"></p>
    </div>

    <div class="block">
      <div class="block-head">
        <span class="block-label">注水滴水聲</span>
        <button type="button" class="chip" id="sfxToggle" aria-pressed="true">開啟</button>
      </div>
    </div>

    <div class="block">
      <p class="set-title" id="stageTitle">段落設定</p>
      <div id="setRows"></div>
    </div>

    <p class="note">
      每段再分「注水」與「等待」，任一項填 0 即略過該子段。<br>
      選了配方時段落秒數會鎖定，切到「自訂」即可自由調整。<br>
      計時進行中無法修改，按暫停或重設後即可調整。<br>
      注水轉等待為單聲、段落切換為兩聲、結束為三聲，並伴隨震動（震動僅部分 Android 裝置支援）。
    </p>
  </section>

  </div>

</main>

<script>
(function(){
  "use strict";

  var DOSES  = [14, 16, 18, 20, 22];
  var RATIOS = [12, 14, 15, 16, 18, 20];
  var PHASE  = { pour:"注水", wait:"等待" };
  var KEY = "hourglass-brew-v3";
  var MIN = 0, MAX = 600, STEP = 5;

  // 依「累計克數」定義每個配方的注水目標
  function evenCums(dose, total, n){
    var b = Math.min(2 * dose, total), out = [b];
    for (var k = 1; k < n; k++) out.push(b + (total - b) * k / (n - 1));
    return out;
  }

  var RECIPES = [
    {
      id:"three", name:"三段式", ratio:15,
      note:"經典入門：悶蒸後分兩次注水，香氣與口感平衡、層次分明。",
      stages:[{name:"悶蒸",pour:10,wait:20},{name:"萃取",pour:20,wait:25},{name:"尾段",pour:15,wait:30}],
      cums:function(d,t){ var b = 2*d; return [b, b + (t-b)*0.5, t]; }
    },
    {
      id:"four6", name:"四六法", ratio:15,
      note:"粕谷哲 2016 世界沖煮冠軍：五次等量注水、每 45 秒一次，前兩注 40% 調風味、後三注 60% 調濃度，全程約 3:30。",
      stages:[
        {name:"一注",pour:10,wait:35},{name:"二注",pour:10,wait:35},
        {name:"三注",pour:10,wait:35},{name:"四注",pour:10,wait:35},
        {name:"五注",pour:10,wait:20}
      ],
      cums:function(d,t){ return [0.2,0.4,0.6,0.8,1].map(function(x){ return t*x; }); }
    },
    {
      id:"hoff", name:"Hoffmann", ratio:16,
      note:"James Hoffmann 極致 V60：悶蒸兩倍水靜置 45 秒，30 秒內注到六成，再 30 秒注滿，攪拌後等落下，全程約 3:30。",
      stages:[
        {name:"悶蒸",pour:10,wait:35},{name:"主注",pour:30,wait:0},
        {name:"補注",pour:30,wait:0},{name:"落下",pour:0,wait:105}
      ],
      cums:function(d,t){ return [2*d, t*0.6, t, t]; }
    },
    {
      id:"knife3", name:"三刀流", ratio:15,
      note:"學院派：悶蒸 30 秒後分三刀等量注水，等粉層下沉成碗狀再下一刀，容錯高、尾韻乾淨，全程約 2:25。",
      stages:[
        {name:"悶蒸",pour:10,wait:20},{name:"一刀",pour:10,wait:20},
        {name:"二刀",pour:10,wait:20},{name:"三刀",pour:10,wait:45}
      ],
      cums:function(d,t){ var b = 2*d, r = t - b; return [b, b + r/3, b + 2*r/3, t]; }
    },
    {
      id:"custom", name:"自訂", ratio:15,
      note:"自由設定段落名稱與每段的注水／等待秒數。",
      stages:null,
      cums:function(d,t,n){ return evenCums(d,t,n); }
    }
  ];
  var DEFAULT_CUSTOM = [
    {name:"悶蒸",pour:10,wait:20},{name:"萃取",pour:20,wait:25},{name:"尾段",pour:15,wait:30}
  ];

  // ── 設定值 ──
  var dose = 18, ratio = 15, recipeId = "three";
  var customStages = cloneStages(DEFAULT_CUSTOM);
  var waterSfx = true;   // 注水時的背景水聲
  var stages = [];      // 目前生效的段落
  var cums = [];        // 每段的累計注水目標（克）
  var steps = [];       // 展開後的子段序列

  // ── 計時狀態 ──
  var stepIdx = 0, running = false, finished = false, remainMs = 0, endAt = 0;

  // ── DOM ──
  var sceneEl     = document.getElementById("scene");
  var stepListEl  = document.getElementById("stepList");
  var setRowsEl   = document.getElementById("setRows");
  var elapsedLine = document.getElementById("elapsedLine");
  var startBtn    = document.getElementById("startBtn");
  var resetBtn    = document.getElementById("resetBtn");
  var gearBtn     = document.getElementById("gearBtn");
  var settings    = document.getElementById("settings");
  var summaryLine = document.getElementById("summaryLine");
  var doseChips   = document.getElementById("doseChips");
  var ratioChips  = document.getElementById("ratioChips");
  var recipeChips = document.getElementById("recipeChips");
  var doseValue   = document.getElementById("doseValue");
  var waterValue  = document.getElementById("waterValue");
  var recipeTime  = document.getElementById("recipeTime");
  var recipeNote  = document.getElementById("recipeNote");
  var stageTitle  = document.getElementById("stageTitle");
  var sfxToggle   = document.getElementById("sfxToggle");


  // ── 工具 ──
  function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }
  function cloneStages(a){
    return a.map(function(s){ return { name:s.name, pour:s.pour, wait:s.wait }; });
  }
  function recipeOf(id){
    for (var i=0;i<RECIPES.length;i++) if (RECIPES[i].id === id) return RECIPES[i];
    return RECIPES[0];
  }
  function fmt(ms){
    var t = Math.max(0, Math.ceil(ms/1000));
    var m = Math.floor(t/60), s = t%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }
  function fmtDown(ms){
    var t = Math.max(0, Math.floor(ms/1000));
    var m = Math.floor(t/60), s = t%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }
  function elapsedMs(){
    var all = totalSec() * 1000;
    if (finished) return all;
    var e = 0;
    for (var k=0; k<stepIdx; k++) e += steps[k].sec * 1000;
    return clamp(e + (curStep().sec * 1000 - remainMs), 0, all);
  }
  function escapeAttr(s){
    return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  }
  function stageSec(i){ return stages[i].pour + stages[i].wait; }
  function totalSec(){
    return stages.reduce(function(a,s){ return a + s.pour + s.wait; }, 0);
  }
  function totalWater(){ return dose * ratio; }
  function isCustom(){ return recipeId === "custom"; }

  // ── 儲存 ──
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        dose:dose, ratio:ratio, recipe:recipeId, custom:customStages, sfx:waterSfx
      }));
    }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (typeof d.sfx === "boolean") waterSfx = d.sfx;
      if (DOSES.indexOf(d.dose) >= 0) dose = d.dose;
      if (RATIOS.indexOf(d.ratio) >= 0) ratio = d.ratio;
      if (typeof d.recipe === "string" && recipeOf(d.recipe).id === d.recipe) recipeId = d.recipe;
      if (Array.isArray(d.custom) && d.custom.length){
        customStages = d.custom.map(function(s,i){
          var base = DEFAULT_CUSTOM[i] || DEFAULT_CUSTOM[0];
          var st = {
            name: (typeof s.name === "string" && s.name.trim()) ? s.name.trim().slice(0,6) : base.name,
            pour: clamp(parseInt(s.pour,10) || 0, MIN, MAX),
            wait: clamp(parseInt(s.wait,10) || 0, MIN, MAX)
          };
          if (st.pour + st.wait === 0) st.wait = base.wait;
          return st;
        });
      }
    }catch(e){}
  }

  // ── 子段序列與注水目標 ──
  function buildSteps(){
    steps = [];
    stages.forEach(function(s, i){
      if (s.pour > 0) steps.push({ stage:i, kind:"pour", sec:s.pour });
      if (s.wait > 0) steps.push({ stage:i, kind:"wait", sec:s.wait });
    });
    if (!steps.length) steps.push({ stage:0, kind:"wait", sec:30 });
  }
  function computeCums(){
    var r = recipeOf(recipeId), t = totalWater();
    cums = r.cums(dose, t, stages.length).map(function(g){ return Math.round(g); });
    while (cums.length < stages.length) cums.push(t);
  }

  // ── 場景：水壺 → 濾杯 → 分享壺 ──
  var CONE_TOP = 96, CONE_BOT = 150;          // 濾杯錐體
  var LIQ_TOP = 178, LIQ_BOT = 254;           // 分享壺液面範圍
  var LIQ_H = LIQ_BOT - LIQ_TOP;
  var scene = {};

  function buildScene(){
    sceneEl.innerHTML =
      '<svg viewBox="0 0 120 270" role="img" aria-label="手沖示意">' +
        '<defs>' +
          '<clipPath id="coneClip"><path d="M22,'+CONE_TOP+' H98 L64,'+CONE_BOT+' H56 Z"/></clipPath>' +
          '<clipPath id="potClip"><path d="M30,176 V240 A11,11 0 0 0 41,251 H79 A11,11 0 0 0 90,240 V176 Z"/></clipPath>' +
        '</defs>' +

        // 水壺
        '<g class="rig">' +
          '<g class="kettle">' +
            '<path d="M80,41 C74,41 71,35 70.4,28 C69.8,22.8 65.2,21.4 63.9,23.2" ' +
              'fill="none" stroke="var(--ink)" stroke-width="2.6" ' +
              'stroke-linecap="round" stroke-linejoin="round"/>' +
            '<rect x="79" y="26" width="28" height="26" rx="6" fill="none" ' +
              'stroke="var(--ink)" stroke-width="1.6"/>' +
            '<line x1="80" y1="32" x2="106" y2="32" stroke="var(--steel)" stroke-width="1.1"/>' +
            '<rect x="90" y="20" width="6" height="4" rx="1.5" fill="none" ' +
              'stroke="var(--ink)" stroke-width="1.3"/>' +
            '<path d="M107,32 C115,34 115,46 107,48" fill="none" stroke="var(--ink)" stroke-width="1.6"/>' +
          '</g>' +
          // 壺嘴落下的水柱
          '<line id="pourStream" x1="60" y1="36" x2="60" y2="'+(CONE_TOP-4)+'" ' +
            'stroke="var(--brew-pour)" stroke-width="1.8" stroke-linecap="round" ' +
            'stroke-dasharray="3 6" opacity="0"/>' +
        '</g>' +

        // 濾杯內的水位
        '<g clip-path="url(#coneClip)">' +
          '<rect id="coneLiq" x="20" y="'+CONE_BOT+'" width="80" height="0" fill="var(--brew-wait)"/>' +
        '</g>' +
        // 濾杯本體
        '<path d="M22,'+CONE_TOP+' H98 L64,'+CONE_BOT+' H56 Z" fill="none" ' +
          'stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>' +
        '<line x1="20" y1="'+CONE_TOP+'" x2="100" y2="'+CONE_TOP+'" stroke="var(--ink)" ' +
          'stroke-width="1.8" stroke-linecap="round"/>' +
        '<line x1="38" y1="104" x2="58" y2="142" stroke="var(--hair)" stroke-width="1"/>' +
        '<line x1="60" y1="102" x2="60" y2="142" stroke="var(--hair)" stroke-width="1"/>' +
        '<line x1="82" y1="104" x2="62" y2="142" stroke="var(--hair)" stroke-width="1"/>' +
        '<rect x="56" y="'+CONE_BOT+'" width="8" height="6" fill="none" ' +
          'stroke="var(--ink)" stroke-width="1.4"/>' +

        // 濾杯滴下的咖啡
        '<line id="dripStream" x1="60" y1="'+(CONE_BOT+8)+'" x2="60" y2="172" ' +
          'stroke="var(--brew-deep)" stroke-width="1.6" stroke-linecap="round" ' +
          'stroke-dasharray="2 7" opacity="0"/>' +

        // 分享壺裡的咖啡
        '<g clip-path="url(#potClip)">' +
          '<rect id="potLiq" x="28" y="'+LIQ_BOT+'" width="64" height="0" fill="var(--brew-deep)"/>' +
          '<line id="potSurface" x1="30" y1="'+LIQ_BOT+'" x2="90" y2="'+LIQ_BOT+'" ' +
            'stroke="#FFFFFF" stroke-width="1.2" opacity="0"/>' +
        '</g>' +
        // 分享壺本體
        '<path d="M30,172 H90" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>' +
        '<path d="M92,175 C100,180 100,190 92,194" fill="none" stroke="var(--ink)" stroke-width="1.5"/>' +
        '<path d="M30,172 V240 A11,11 0 0 0 41,251 H79 A11,11 0 0 0 90,240 V172" ' +
          'fill="none" stroke="var(--glass)" stroke-width="1.4" stroke-linejoin="round"/>' +
        '<line x1="34" y1="'+(LIQ_BOT-25)+'" x2="40" y2="'+(LIQ_BOT-25)+'" stroke="var(--hair)" stroke-width="1"/>' +
        '<line x1="34" y1="'+(LIQ_BOT-50)+'" x2="40" y2="'+(LIQ_BOT-50)+'" stroke="var(--hair)" stroke-width="1"/>' +
        '<line x1="35" y1="180" x2="35" y2="202" stroke="#FFFFFF" stroke-width="1.4" ' +
          'opacity=".45" stroke-linecap="round"/>' +
      '</svg>';

    scene = {
      kettle: sceneEl.querySelector(".kettle"),
      rig:    sceneEl.querySelector(".rig"),
      pour:   sceneEl.querySelector("#pourStream"),
      cone:   sceneEl.querySelector("#coneLiq"),
      drip:   sceneEl.querySelector("#dripStream"),
      liq:    sceneEl.querySelector("#potLiq"),
      surface:sceneEl.querySelector("#potSurface")
    };
  }

  // ── 右側段落清單 ──
  var rows = [];
  function hintOf(i){
    var s = stages[i], parts = [];
    if (s.pour > 0) parts.push('繞圈注水至 <span class="step-water">' + cums[i] + ' g</span>');
    else parts.push("不注水");
    if (s.wait > 0) parts.push("靜置 " + s.wait + " 秒");
    return parts.join("，");
  }
  var doneEl = null;
  function buildStepList(){
    stepListEl.innerHTML = "";
    rows = [];
    stages.forEach(function(s, i){
      var li = document.createElement("li");
      li.className = "step";
      li.innerHTML =
        '<div class="step-head">' +
          '<span><span class="step-name"></span><span class="step-state"></span></span>' +
          '<span class="step-time"></span>' +
        '</div>' +
        '<p class="step-hint"></p>' +
        '<div class="subs">' +
          '<span class="sub" data-kind="pour"><span class="sub-label">注水</span>' +
            '<span class="sub-time"></span></span>' +
          '<span class="sub" data-kind="wait"><span class="sub-label">靜置</span>' +
            '<span class="sub-time"></span></span>' +
        '</div>';
      stepListEl.appendChild(li);
      rows.push({
        root: li,
        name: li.querySelector(".step-name"),
        state: li.querySelector(".step-state"),
        time: li.querySelector(".step-time"),
        hint: li.querySelector(".step-hint"),
        pour: li.querySelector('.sub[data-kind="pour"]'),
        wait: li.querySelector('.sub[data-kind="wait"]'),
        pourTime: li.querySelector('.sub[data-kind="pour"] .sub-time'),
        waitTime: li.querySelector('.sub[data-kind="wait"] .sub-time')
      });
    });

    doneEl = document.createElement("li");
    doneEl.className = "step is-active done-note";
    doneEl.hidden = true;
    stepListEl.appendChild(doneEl);
  }

  // 落水動畫
  var st = document.createElement("style");
  st.textContent = "@keyframes fall{to{stroke-dashoffset:-70}}" +
    "#pourStream{animation:fall .9s linear infinite}" +
    "#dripStream{animation:fall 1.6s linear infinite}";
  document.head.appendChild(st);

  // ── 繪製 ──
  function curStep(){ return steps[Math.min(stepIdx, steps.length-1)]; }

  function stageElapsedMs(i){
    if (finished) return stageSec(i) * 1000;
    var cur = curStep();
    if (i < cur.stage) return stageSec(i) * 1000;
    if (i > cur.stage) return 0;
    var e = 0;
    for (var k=0; k<stepIdx; k++) if (steps[k].stage === i) e += steps[k].sec * 1000;
    return e + (cur.sec * 1000 - remainMs);
  }
  function stageRemainMs(i){
    return Math.max(0, stageSec(i)*1000 - stageElapsedMs(i));
  }
  function progressOf(i){
    var t = stageSec(i) * 1000;
    if (t <= 0) return finished ? 1 : (i < curStep().stage ? 1 : 0);
    return clamp(stageElapsedMs(i) / t, 0, 1);
  }
  function currentWaterG(){
    var t = totalWater();
    if (finished) return t;
    var cur = curStep();
    var prev = cur.stage === 0 ? 0 : cums[cur.stage - 1];
    var tgt  = cums[cur.stage];
    if (cur.kind === "wait") return tgt;          // 等待時液面停住
    var sec = cur.sec * 1000;
    var f = sec > 0 ? clamp(1 - remainMs / sec, 0, 1) : 1;
    return prev + (tgt - prev) * f;               // 注水時才上升
  }
  // 分享壺液面：滴濾有滯後，注水時流下一部分，靜置時把剩下的流完
  function servedWaterG(){
    var t = totalWater();
    if (finished) return t;
    var cur  = curStep();
    var prev = cur.stage === 0 ? 0 : cums[cur.stage - 1];
    var tgt  = cums[cur.stage];
    var d    = tgt - prev;
    var st   = stages[cur.stage];
    var share = (st.wait > 0) ? ((st.pour > 0) ? 0.45 : 0) : 1;   // 注水期間流下的比例
    var sec = cur.sec * 1000;
    var f = sec > 0 ? clamp(1 - remainMs / sec, 0, 1) : 1;
    if (cur.kind === "pour") return prev + d * share * f;
    return prev + d * (share + (1 - share) * f);
  }
  function addedAt(i){
    return cums[i] - (i === 0 ? 0 : cums[i-1]);
  }

  function render(){
    var cur = curStep();
    var css = getComputedStyle(document.documentElement);
    var C_POUR = css.getPropertyValue("--brew-pour").trim() || "#5C3A22";
    var water = currentWaterG(), waterAll = totalWater();

    // ── 場景 ──
    var pouring = running && !finished && cur.kind === "pour";
    scene.kettle.classList.toggle("pouring", !finished && cur.kind === "pour");
    scene.rig.classList.toggle("circling", pouring);   // 注水時繞圈

    // 濾杯水位：注水時上升，靜置時慢慢落下
    var coneP = 0;
    if (!finished && !isFresh()){
      if (cur.kind === "pour"){
        coneP = 0.25 + 0.75 * clamp(1 - remainMs / (cur.sec * 1000), 0, 1);
      } else {
        coneP = clamp(remainMs / (cur.sec * 1000), 0, 1);
      }
    }
    var coneH = (CONE_BOT - CONE_TOP) * coneP;
    scene.cone.setAttribute("y", (CONE_BOT - coneH).toFixed(2));
    scene.cone.setAttribute("height", coneH.toFixed(2));

    // 壺嘴的水柱一路落到濾杯裡的水面
    scene.pour.setAttribute("y2", (CONE_BOT - coneH - 1).toFixed(2));
    scene.pour.setAttribute("opacity", pouring ? "0.9" : "0");
    scene.pour.style.stroke = C_POUR;
    scene.drip.setAttribute("opacity", (running && !finished && coneP > 0.04) ? "0.85" : "0");

    // 分享壺：液面 = 已滴落的量（注水與靜置期間都持續上升）
    var served = servedWaterG();
    var hAll = LIQ_H * (waterAll > 0 ? clamp(served / waterAll, 0, 1) : 0);
    scene.liq.setAttribute("y", (LIQ_BOT - hAll).toFixed(2));
    scene.liq.setAttribute("height", hAll.toFixed(2));
    scene.surface.setAttribute("y1", (LIQ_BOT - hAll).toFixed(2));
    scene.surface.setAttribute("y2", (LIQ_BOT - hAll).toFixed(2));
    scene.surface.setAttribute("opacity", hAll > 2 ? "0.5" : "0");

    // 落下的水穿過透明的分享壺，一路滴到目前的液面
    scene.drip.setAttribute("y2", (LIQ_BOT - hAll - 1).toFixed(2));

    // ── 右側清單 ──
    for (var i=0;i<stages.length;i++){
      var r = rows[i], s = stages[i];
      var isActive = (i === cur.stage) && !finished;
      var isDone = finished || i < cur.stage;

      r.name.textContent = s.name;
      r.state.textContent = isDone ? "完成" : (isActive ? PHASE[cur.kind] + "中" : "待沖");
      r.time.textContent = fmt(isDone ? 0 : stageRemainMs(i));
      r.hint.innerHTML = hintOf(i);

      (function(r, s, isActive, isDone){
        ["pour","wait"].forEach(function(kind){
          var el = r[kind], tEl = r[kind + "Time"], sec = s[kind];
          var live = isActive && cur.kind === kind;
          var passed = isDone || (isActive && cur.kind === "wait" && kind === "pour");
          el.hidden = sec <= 0;
          el.classList.toggle("on", live);
          el.classList.toggle("off", passed && !live);
          tEl.textContent = live ? fmt(remainMs) : (passed ? "00:00" : fmt(sec * 1000));
        });
      })(r, s, isActive, isDone);

      r.root.classList.toggle("is-active", isActive);
      r.root.classList.toggle("is-done", isDone);
      r.root.hidden = isDone;          // 做完就收起來，後面的往上遞補
    }

    if (doneEl){
      doneEl.hidden = !finished;
      if (finished){
        doneEl.innerHTML =
          '<div class="step-head"><span class="step-name">沖煮完成</span></div>' +
          '<p class="step-hint">總時間 ' + fmt(totalSec()*1000) +
          '，共 <span class="step-water">' + totalWater() + ' g</span></p>';
      }
    }

    elapsedLine.innerHTML = fmtDown(elapsedMs()) +
      '<span class="elapsed-g">' + Math.round(water) + ' g</span>';
    syncWater();

    startBtn.textContent = finished ? "再沖一次" : (running ? "暫停" : (isFresh() ? "開始" : "繼續"));
    gearBtn.disabled = running;
    summaryLine.textContent =
      dose + " g · 1:" + ratio + " · " + recipeOf(recipeId).name +
      " · " + totalWater() + " g · " + fmt(totalSec()*1000);
  }

  function isFresh(){
    return !running && !finished && stepIdx === 0 && remainMs === steps[0].sec*1000;
  }

  // ── 計時迴圈 ──
  function tick(){
    if (running){
      remainMs = endAt - performance.now();
      if (remainMs <= 0){
        remainMs = 0;
        advance();
      }
      render();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function advance(){
    var prev = steps[stepIdx];
    if (stepIdx < steps.length - 1){
      stepIdx++;
      var next = steps[stepIdx];
      remainMs = next.sec * 1000;
      endAt = performance.now() + remainMs;
      if (next.stage === prev.stage){
        chime([784], 0.14, 0.13);            // 同段內：注水 → 等待
        buzz([60]);
      } else {
        chime([660, 880], 0.16, 0.22);       // 換段
        buzz([130]);
      }
    } else {
      running = false;
      finished = true;
      waterOff();
      chime([880, 660, 523], 0.32, 0.24);    // 結束
      buzz([200,100,200,100,340]);
      releaseWake();
    }
  }

  // ── 操作 ──
  function start(){
    if (finished) reset();
    unlockAudio();
    running = true;
    endAt = performance.now() + remainMs;
    requestWake();
    closeSettings();
    render();
  }
  function pause(){
    running = false;
    waterOff();
    remainMs = Math.max(0, endAt - performance.now());
    releaseWake();
    render();
  }
  function reset(){
    running = false; finished = false; stepIdx = 0;
    waterOff();
    remainMs = steps[0].sec * 1000;
    releaseWake();
    render();
  }

  startBtn.addEventListener("click", function(){
    if (running) pause(); else start();
  });
  resetBtn.addEventListener("click", reset);

  gearBtn.addEventListener("click", function(){
    if (settings.hidden) openSettings(); else closeSettings();
  });
  summaryLine.addEventListener("click", function(){
    if (running) return;
    if (settings.hidden) openSettings(); else closeSettings();
  });
  function openSettings(){
    settings.hidden = false;
    gearBtn.setAttribute("aria-expanded","true");
  }
  function closeSettings(){
    settings.hidden = true;
    gearBtn.setAttribute("aria-expanded","false");
  }

  // ── 前置設定：粉重 / 粉水比 / 沖法 ──
  function buildChips(){
    doseChips.innerHTML = "";
    DOSES.forEach(function(g){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.dataset.dose = g; b.textContent = g + " g";
      b.addEventListener("click", function(){ setDose(g); });
      doseChips.appendChild(b);
    });
    ratioChips.innerHTML = "";
    RATIOS.forEach(function(r){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.dataset.ratio = r; b.textContent = "1:" + r;
      b.addEventListener("click", function(){ setRatio(r); });
      ratioChips.appendChild(b);
    });
    recipeChips.innerHTML = "";
    RECIPES.forEach(function(r){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.dataset.recipe = r.id; b.textContent = r.name;
      b.addEventListener("click", function(){ setRecipe(r.id); });
      recipeChips.appendChild(b);
    });
  }
  sfxToggle.addEventListener("click", function(){
    waterSfx = !waterSfx;
    if (!waterSfx) waterOff();
    save(); syncChips(); syncWater();
  });
  function syncChips(){
    sfxToggle.textContent = waterSfx ? "開啟" : "關閉";
    sfxToggle.classList.toggle("on", waterSfx);
    sfxToggle.setAttribute("aria-pressed", waterSfx ? "true" : "false");
    [].forEach.call(doseChips.children, function(b){
      b.classList.toggle("on", +b.dataset.dose === dose);
    });
    [].forEach.call(ratioChips.children, function(b){
      b.classList.toggle("on", +b.dataset.ratio === ratio);
    });
    [].forEach.call(recipeChips.children, function(b){
      b.classList.toggle("on", b.dataset.recipe === recipeId);
    });
    doseValue.textContent  = dose + " g";
    waterValue.textContent = "總水量 " + totalWater() + " g";
    recipeTime.textContent = "全程 " + fmt(totalSec()*1000);
    recipeNote.textContent = recipeOf(recipeId).note;
    stageTitle.textContent = isCustom() ? "段落設定" : "段落設定（配方鎖定）";
  }
  function setDose(g){
    if (running) return;
    dose = g; save(); computeCums(); syncChips(); render();
  }
  function setRatio(r){
    if (running) return;
    ratio = r; save(); computeCums(); syncChips(); render();
  }
  function setRecipe(id){
    if (running) return;
    recipeId = id;
    var r = recipeOf(id);
    ratio = r.ratio;
    save();
    applyRecipe();
  }
  function applyRecipe(){
    var r = recipeOf(recipeId);
    stages = isCustom() ? customStages : cloneStages(r.stages);
    buildSteps();
    computeCums();
    buildScene();
    buildStepList();
    buildRows();
    reset();
    syncChips();
    render();
  }

  // ── 段落設定列 ──
  function buildRows(){
    setRowsEl.innerHTML = "";
    setRowsEl.classList.toggle("locked", !isCustom());
    stages.forEach(function(s, i){
      var row = document.createElement("div");
      row.className = "srow";
      row.innerHTML =
        '<div class="srow-head">' +
          '<input type="text" maxlength="6" value="'+escapeAttr(s.name)+'" aria-label="第 '+(i+1)+' 段名稱">' +
          '<span class="srow-sum" data-sum></span>' +
        '</div>' +
        field(i, "pour", s.pour) +
        field(i, "wait", s.wait);

      var nameIn = row.querySelector('input[type=text]');
      nameIn.disabled = !isCustom();
      nameIn.addEventListener("input", function(){
        stages[i].name = nameIn.value.trim() || ("第" + (i+1) + "段");
        save(); render();
      });

      [].forEach.call(row.querySelectorAll(".field"), function(f){
        var kind = f.dataset.kind;
        var numIn = f.querySelector("input[type=number]");
        numIn.disabled = !isCustom();
        numIn.addEventListener("change", function(){
          applySec(i, kind, clamp(parseInt(numIn.value,10) || 0, MIN, MAX), row);
        });
        [].forEach.call(f.querySelectorAll(".stepper button"), function(b){
          b.disabled = !isCustom();
          b.addEventListener("click", function(){
            var v = clamp((parseInt(numIn.value,10)||0) + STEP * parseInt(b.dataset.d,10), MIN, MAX);
            applySec(i, kind, v, row);
          });
        });
      });

      setRowsEl.appendChild(row);
      syncRow(i, row);
    });
  }
  function field(i, kind, val){
    return '<div class="field" data-kind="'+kind+'">' +
      '<span class="field-label"><i class="dot-'+kind+'"></i>'+PHASE[kind]+'</span>' +
      '<span class="stepper">' +
        '<button type="button" data-d="-1" aria-label="減少">−</button>' +
        '<input type="number" min="'+MIN+'" max="'+MAX+'" step="'+STEP+'" value="'+val+'" ' +
          'aria-label="第 '+(i+1)+' 段'+PHASE[kind]+'秒數">' +
        '<button type="button" data-d="1" aria-label="增加">+</button>' +
        '<span class="unit">秒</span>' +
      '</span>' +
    '</div>';
  }
  function syncRow(i, row){
    [].forEach.call(row.querySelectorAll(".field"), function(f){
      f.querySelector("input[type=number]").value = stages[i][f.dataset.kind];
    });
    row.querySelector("[data-sum]").textContent = "小計 " + fmt(stageSec(i)*1000);
  }
  function applySec(i, kind, v, row){
    if (!isCustom()) return;
    var other = (kind === "pour") ? "wait" : "pour";
    stages[i][kind] = v;
    if (stages[i].pour + stages[i].wait === 0) stages[i][other] = STEP;
    save();
    buildSteps();
    if (!running) reset();
    syncRow(i, row);
    syncChips();
    render();
  }

  // ── 音效 ──
  var ac = null;
  function unlockAudio(){
    try{
      if (!ac){
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return;
        ac = new C();
      }
      if (ac.state === "suspended") ac.resume();
    }catch(e){ ac = null; }
  }
  function chime(freqs, dur, vol){
    if (!ac) return;
    var peak = vol || 0.22;
    try{
      freqs.forEach(function(f, n){
        var t0 = ac.currentTime + n * dur * 0.62;
        var osc = ac.createOscillator();
        var gain = ac.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, t0);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain); gain.connect(ac.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.05);
      });
    }catch(e){}
  }
  // ── 注水滴水聲：合成水滴，隨機間隔 ──
  var nextDripAt = 0;
  var DRIP_VOL = 0.055;

  function drip(){
    if (!ac) return;
    try{
      var t0 = ac.currentTime;
      var f0 = 780 + Math.random() * 620;          // 每滴音高略有不同
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(f0, t0);
      osc.frequency.exponentialRampToValueAtTime(f0 * 0.42, t0 + 0.085);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(DRIP_VOL * (0.7 + Math.random() * 0.5), t0 + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      osc.connect(gain); gain.connect(ac.destination);
      osc.start(t0); osc.stop(t0 + 0.2);
    }catch(e){}
  }
  function waterOff(){ nextDripAt = 0; }
  function syncWater(){
    if (!(running && !finished && curStep().kind === "pour")){ nextDripAt = 0; return; }
    if (!waterSfx || !ac) return;
    var t = performance.now();
    if (!nextDripAt) nextDripAt = t;
    if (t >= nextDripAt){
      drip();
      nextDripAt = t + 240 + Math.random() * 420;   // 滴、滴答、滴……
    }
  }

  function buzz(pattern){
    try{ if (navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
  }

  // ── 螢幕常亮 ──
  var wake = null;
  function requestWake(){
    try{
      if (!navigator.wakeLock) return;
      navigator.wakeLock.request("screen").then(function(w){ wake = w; }).catch(function(){});
    }catch(e){}
  }
  function releaseWake(){
    try{ if (wake){ wake.release(); wake = null; } }catch(e){}
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && running) requestWake();
  });

  // ── 空白鍵 ──
  document.addEventListener("keydown", function(e){
    if (e.code === "Space" && e.target === document.body){
      e.preventDefault();
      if (running) pause(); else start();
    }
  });

  // ── 啟動 ──
  load();
  buildChips();
  applyRecipe();
})();
</script>
</body>
